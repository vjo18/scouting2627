name: Update scouting data
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'config/competitions.json'
      - '.github/workflows/update.yml'
  schedule:
    - cron: '20 7 * * 1'
permissions:
  contents: write
concurrency:
  group: scouting-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Validated player-only refresh
        run: python3 scripts/refresh.py
      - name: Commit validated data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data_raw public/data
          if ! git diff --cached --quiet; then
            git commit -m 'Update scouting player data'
            git push
          fi
