name: Update scouting data
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'config/competitions.json'
  schedule:
    - cron: '20 7 * * 1'
permissions:
  contents: write
concurrency:
  group: scouting-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Validated player-only refresh
        run: python3 scripts/refresh.py
      - name: Commit validated data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data_raw public/data
          if ! git diff --cached --quiet; then
            git commit -m 'Update scouting player data'
            # Another commit may land on main during a long RBFA scrape.
            # Rebase the generated data commit instead of force-pushing.
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                echo "Scouting data pushed successfully"
                exit 0
              fi
              echo "Main changed during push (attempt $attempt); retrying..."
              sleep 3
            done
            echo "Unable to push data after five attempts" >&2
            exit 1
          fi
